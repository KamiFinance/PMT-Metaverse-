name: Deploy Bridge API

on:
  push:
    branches: [main]
    paths: [bridge-api/**]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd bridge-api && npm install
      - run: cd bridge-api && npm test --if-present

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/pmt-metaverse
            git pull origin main
            cd bridge-api
            npm install --production
            pm2 restart pmt-bridge-api || pm2 start server.js --name pmt-bridge-api
            pm2 save

      - name: Notify success
        run: echo "Bridge API deployed at $(date)"
